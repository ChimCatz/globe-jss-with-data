<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Globe Trivia</title>
  <meta name="description" content="A cartoon 3D globe - spin it, click a country and explore its sourced tech & data facts.">
  <meta name="theme-color" content="#120f3a">
  <!-- link previews when the page is shared -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Globe Trivia">
  <meta property="og:description" content="Spin a cartoon 3D globe and click any country to explore its sourced tech & data facts.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='29' fill='%234cc3ff' stroke='%231d2340' stroke-width='4'/%3E%3Cpath d='M14 22c6-4 12 2 16-2s2-8 8-8c4 4 10 6 12 14-6 0-8 6-14 4s-4 8-10 8-4 8-10 6c-4-6-6-14-2-22z' fill='%238de4c3' stroke='%231d2340' stroke-width='3' stroke-linejoin='round'/%3E%3Cpath d='M40 40c4-2 10 0 12 4-2 6-8 10-14 8 0-4 0-10 2-12z' fill='%23ffbe8f' stroke='%231d2340' stroke-width='3' stroke-linejoin='round'/%3E%3C/svg%3E">
  <!-- fonts are optional: the widget falls back to system fonts offline -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- loaded without blocking the first paint -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap"></noscript>
  <link rel="stylesheet" href="css/globe-trivia.css">
  <style>
    html, body { margin: 0; height: 100%; background: #120f3a; }
    #globe-app { height: 100vh; height: 100dvh; }
    /* link back to the author's portfolio (added by the script below) */
    .gt .gt-made-by {
      display: inline-block; margin-top: 10px; padding: 4px 11px; pointer-events: auto;
      border: 1.5px solid rgba(255, 255, 255, .22); border-radius: 999px;
      color: var(--gt-muted); font-size: 12px; font-weight: 700; text-decoration: none;
      transition: color .2s, border-color .2s;
    }
    .gt .gt-made-by:hover, .gt .gt-made-by:focus-visible { color: #fff; border-color: var(--gt-accent-2); }
  </style>
</head>
<body>
  <!-- Drop this div anywhere in your site and give it a height. -->
  <div id="globe-app"></div>

  <!-- libraries (vendored so the page also works offline / from file://) -->
  <script src="vendor/d3.min.js"></script>
  <script src="vendor/topojson-client.min.js"></script>
  <!-- data -->
  <script src="data/world-110m.js"></script>
  <script src="data/world-50m.js"></script>
  <script src="data/countries.js"></script>
  <script src="data/tech-trivia.js"></script>
  <!-- app -->
  <script src="js/globe-trivia.js"></script>
  <script>
    window.globe = GlobeTrivia.mount(document.getElementById('globe-app'));

    // A small link back to the portfolio, under the subtitle. It sits in the HUD,
    // so it fades out with it on a country's map. Left out when the globe is shown
    // inside another page (the portfolio embeds it), which has its own navigation.
    if (window.self === window.top) {
      const link = document.createElement('a');
      link.className = 'gt-made-by';
      link.href = 'https://chimcatz.github.io/cz-portfolio-site/';
      link.textContent = 'Made by cz.catzzz ↗';
      document.querySelector('#globe-app .gt-brand').append(link);
    }
  </script>
</body>
</html>
